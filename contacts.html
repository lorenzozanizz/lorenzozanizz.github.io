  <style>
    .contact-list {
      display: grid;
      gap: 12px;
      max-width: 560px;
      margin: 24px 0;
    }

    .contact-link {
      display: block;
      padding: 16px 20px;
      border: 1px solid #dedee5;
      border-radius: 12px;
      background: #f5f5f7;
      color: #303038;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: background .15s ease;
    }

    .contact-link:hover {
      background: #eaeaf0;
    }

    .contact-link {
  display: flex;
  align-items: center;
  gap: 14px;
}


    .contact-link:focus-visible {
      outline: 2px solid #74748b;
      outline-offset: 3px;
    }

    .contact-label {
      display: block;
      margin-bottom: 5px;
      color: #696974;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .contact-value {
      font-weight: 600;
    }
  </style>
</head>
